version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: friday
    groups:
      go-deps:
        patterns: ["*"]
    commit-message:
      prefix: chore
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
    groups:
      # CodeQL runs only when its init and analyze steps are on one version, so both move in one pull request.
      codeql-action:
        patterns: ["github/codeql-action*"]
    commit-message:
      prefix: ci
