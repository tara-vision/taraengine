version: 2

project_name: taraengine

before:
  hooks:
    - go mod tidy

builds:
  - id: taraengine
    main: ./cmd/taraengine
    binary: taraengine
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/tara-vision/taraengine/internal/version.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: binaries
    ids: [taraengine]
    formats: [binary]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256
  # install.sh is signed with everything else, so engine.tara.vision serves a script the release vouches for.
  extra_files:
    - glob: ./install.sh

# The macOS binary is signed with the Developer ID of Tara Vision, LLC and notarized by Apple from this Linux runner,
# before the checksums are made, so checksums.txt, its cosign bundle and the provenance cover the signed binary. The
# release waits for Apple's verdict and fails on a rejection. Without the secrets (a snapshot, CI's check) it is off.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [taraengine]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

signs:
  # cosign 3.x writes a Sigstore bundle (signature + certificate + log entry in one file).
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

nfpms:
  - id: packages
    package_name: taraengine
    ids: [taraengine]
    vendor: Tara Vision, LLC
    homepage: https://github.com/tara-vision/taraengine
    maintainer: "Tara Vision, LLC <contact@tara.vision>"
    description: The Tara Vision inference engine, a local OpenAI-compatible server built on llama.cpp
    license: MIT
    formats:
      - deb
      - rpm
    section: utils
    bindir: /usr/bin
    # The license texts go where the packaging policies of both families expect them.
    contents:
      - src: LICENSE
        dst: /usr/share/doc/taraengine/LICENSE
      - src: NOTICE
        dst: /usr/share/doc/taraengine/NOTICE
    # The binary writes the unit itself (taraengine service install), so a package ships no unit of its own.
    scripts:
      postinstall: packaging/postinstall.sh
      preremove: packaging/preremove.sh
      postremove: packaging/postremove.sh
    # llama.cpp's Linux builds link GCC's OpenMP library, which a minimal system lacks; the names differ by family.
    overrides:
      deb:
        dependencies:
          - libgomp1
      rpm:
        dependencies:
          - libgomp

release:
  github:
    owner: tara-vision
    name: taraengine
  extra_files:
    - glob: ./install.sh
  draft: false
  prerelease: auto
  mode: replace

changelog:
  disable: true
